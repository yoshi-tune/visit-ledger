<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>予約</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="phone">
    <header class="phone-header">
      <div class="shop"><span id="store-name">見本の店</span><small>予約</small></div>
      <div id="progress" class="progress" aria-label="進み具合"></div>
    </header>
    <main class="phone-main">
      <div id="step" class="step"></div>
      <p id="error" class="input-error" role="alert"></p>
    </main>
    <div class="sticky-cta"><div>
      <button id="next" class="btn block lg" type="button">次へ</button>
      <button id="back" class="link-btn" type="button">← もどる</button>
    </div></div>
  </div>
  <script type="module" src="/static/reserve.js"></script>
</body>
</html>
