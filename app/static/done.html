<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>予約が確定しました</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="phone">
    <header class="phone-header">
      <div class="shop"><span id="store-name">見本の店</span><small>予約</small></div>
    </header>
    <main class="phone-main">
      <div id="guide" style="margin-top:16px"></div>
      <h1 style="text-align:center;font-size:1.375rem">予約が確定しました</h1>
      <div class="ticket">
        <div class="muted">予約番号</div>
        <div id="no" class="no">—</div>
      </div>
      <dl id="summary" class="summary"></dl>
      <h2 class="section-title">このあと</h2>
      <ol class="info-list">
        <li><span class="badge-num">1</span><div><b>当日、お店へ</b><br><span class="muted">受付でお名前か予約番号を伝えてください。この画面を撮っておくと安心です</span></div></li>
        <li><span class="badge-num">2</span><div><b>都合が悪くなったら</b><br><span class="muted">お店にご連絡ください。日時の変更や取消をします</span></div></li>
      </ol>
      <section class="store-side">
        <p class="store-side-lead">ここまでがお客様の画面です。ここから先は、お店の側の画面です（見本の店）。</p>
        <a class="btn block" href="/desk">店の側で続ける（受付へ）→</a>
        <p class="muted">受付でこの予約を「来店」にすると、効果の画面の数字が変わり、Claude の分析に進めます。<a href="/about">しくみの説明</a></p>
      </section>
      <p id="error" class="input-error"></p>
    </main>
  </div>
  <script type="module" src="/static/done.js"></script>
</body>
</html>
