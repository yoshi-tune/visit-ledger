<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜ナットク台帳</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login { max-width: 420px; margin: 10vh auto; padding: 0 16px; }
    .login h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .login form { margin-top: 20px; }
  </style>
</head>
<body>
  <main class="login">
    <h1>ナットク台帳（審査用）</h1>
    <p class="muted">審査用に、テスト用の ID で試せます。店・お客様・数字はすべて見本です。</p>
    <form id="form" class="card">
      <label class="field"><span>ID</span><input class="input" id="user" autocomplete="username" required></label>
      <label class="field"><span>パスワード</span><input class="input" id="password" type="password" autocomplete="current-password" required></label>
      <p id="error" class="input-error" role="alert"></p>
      <button class="btn block" type="submit">ログイン</button>
    </form>
    <p class="muted">LP（お客様が見るページ）は、ログインしなくても開けます。</p>
  </main>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
