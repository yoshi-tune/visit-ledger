<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受付</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">受付<small id="store"></small></div>
    <nav class="app-nav"><a href="/desk" aria-current="page">受付</a><a href="/desk/coupon">クーポン</a><a href="/dashboard">効果</a><a href="/settings">店の設定</a><a href="/maintenance">頼む</a><a href="/improve">改善</a></nav>
  </header>
  <main class="app-main">
    <div class="toolbar">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="today-chip" id="today"></span>
        <span class="muted" id="updated"></span>
      </div>
      <div class="row" style="display:flex;gap:10px;align-items:center">
        <span class="muted">担当</span>
        <div id="staff" class="seg" role="group" aria-label="担当"></div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="today">今日の予約<span class="count" id="c-today"></span></button>
      <button role="tab" data-tab="visited">今日の来店<span class="count" id="c-visited"></span></button>
      <button role="tab" data-tab="upcoming">これからの予約<span class="count" id="c-upcoming"></span></button>
      <button role="tab" data-tab="search">名前で探す</button>
      <button role="tab" data-tab="past">押し忘れ</button>
    </div>
    <p id="hint" class="muted"></p>
    <div id="extra"></div>
    <div id="list" class="cards"></div>
  </main>
  <script type="module" src="/static/desk.js"></script>
</body>
</html>
