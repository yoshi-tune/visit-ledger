<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秋の点検キャンペーン</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 id="store-name">（見本の店）</h1>
    <div class="sub">見本の店のページです</div>
  </header>
  <main>
    <section class="lp-hero">
      <h2>秋の点検キャンペーン</h2>
      <p>冬の前に、オイル交換・タイヤ交換・点検をまとめてどうぞ。</p>
    </section>
    <section class="card">
      <h2>受け付けているメニュー</h2>
      <ul id="menus"></ul>
      <button id="reserve">予約の希望を送る</button>
      <p class="muted">希望を受け付けたあと、店から電話で日時を確定します。</p>
      <p id="error" class="error"></p>
    </section>
  </main>
  <script type="module" src="/static/lp.js"></script>
</body>
</html>
