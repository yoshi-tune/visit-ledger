<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>クーポン</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="phone">
    <header class="phone-header">
      <div class="shop"><span id="store-name">見本の店</span><small>クーポン</small></div>
    </header>
    <main class="phone-main">
      <div id="guide" style="margin-top:16px"></div>
      <h1 style="text-align:center;font-size:1.375rem">点検 ¥500 引き</h1>
      <p class="muted" style="text-align:center">オイル交換・タイヤ交換・秋の点検のどれでも使えます（11/15 まで・1回限り）</p>
      <div class="ticket coupon-ticket">
        <img id="qr" class="coupon-qr" alt="クーポンの QR コード" width="220" height="220">
        <div class="muted">クーポンの番号</div>
        <div id="code" class="no">—</div>
        <div id="used" class="muted"></div>
      </div>
      <h2 class="section-title">使い方</h2>
      <ol class="info-list">
        <li><span class="badge-num">1</span><div><b>お店の受付でこの画面を見せる</b><br><span class="muted">予約していなくても使えます。画面を撮っておくと安心です</span></div></li>
        <li><span class="badge-num">2</span><div><b>受付が QR を読むか、番号を入力します</b><br><span class="muted">QR の中身はこのクーポンの番号だけです</span></div></li>
      </ol>
      <p id="error" class="input-error"></p>
    </main>
    <div class="sticky-cta"><div><a id="reserve" class="btn block lg" href="#">予約もする（空いている日時を見る）</a></div></div>
  </div>
  <script type="module" src="/static/coupon.js"></script>
</body>
</html>
